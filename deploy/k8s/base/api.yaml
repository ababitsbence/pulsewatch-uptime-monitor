apiVersion: v1
kind: Service
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: api
  ports:
    - name: http
      port: 8081
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/component: backend
spec:
  # Keep this at 1: the scheduler keeps its "check running" state in memory, so a second
  # replica would run every check twice. Multiple replicas are tracked in issue #20.
  replicas: 1
  strategy:
    # Recreate, so that two API pods never run checks at the same time during an update
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # The API stops at startup if it cannot reach the database, and the "db" name does not
        # resolve until the database pod is ready, so wait for it here instead of crashing.
        # -U is required: this container runs as a user without a passwd entry, and without
        # an explicit user name pg_isready gives up with "no attempt" instead of connecting.
        - name: wait-for-db
          image: postgres:17-alpine
          command:
            - sh
            - -c
            - until pg_isready -h db -p 5432 -U pulsewatch -t 2; do echo "waiting for the database"; sleep 2; done
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      containers:
        - name: api
          image: ghcr.io/ababitsbence/pulsewatch-api
          ports:
            - name: http
              containerPort: 8081
          env:
            - name: DB_URL
              value: jdbc:postgresql://db:5432/pulsewatch
            - name: DB_USER
              value: pulsewatch
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pulsewatch-secrets
                  key: postgres-password
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: pulsewatch-secrets
                  key: jwt-secret
            - name: JAVA_TOOL_OPTIONS
              value: -XX:MaxRAMPercentage=75
          volumeMounts:
            # Tomcat and the JVM need a writable temp directory
            - name: tmp
              mountPath: /tmp
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 250m
              memory: 384Mi
            limits:
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}