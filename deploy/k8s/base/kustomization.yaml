apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: pulsewatch

resources:
  - namespace.yaml
  - postgres.yaml
  - api.yaml
  - web.yaml

labels:
  - pairs:
      app.kubernetes.io/part-of: pulsewatch
    includeSelectors: false

# The published images. Overlays replace the tag (or the whole image) here.
images:
  - name: ghcr.io/ababitsbence/pulsewatch-api
    newTag: latest
  - name: ghcr.io/ababitsbence/pulsewatch-web
    newTag: latest