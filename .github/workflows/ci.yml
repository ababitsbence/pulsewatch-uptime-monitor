name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run tests
        working-directory: backend
        run: ./mvnw -B verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: backend/target/surefire-reports
          retention-days: 7

  docker-image:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: backend
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t pulsewatch-backend backend

  compose-smoke:
    name: Compose smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: backend
    steps:
      - uses: actions/checkout@v7

      - name: Create .env
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')"
            echo "GRAFANA_ADMIN_PASSWORD=$(openssl rand -hex 16)"
          } > .env

      - name: Start the stack
        run: docker compose up --build -d --wait --wait-timeout 180

      - name: Diagnose unhealthy API
        if: failure()
        run: |
          docker compose ps -a
          docker inspect pulsewatch-uptime-monitor-api-1 \
            --format '{{json .State.Health}}'
          docker compose logs --no-color api

      - name: Health endpoint is up
        run: curl -fsS http://localhost:8081/actuator/health

      - name: Register, log in and use the API
        run: |
          set -euo pipefail
          JSON='Content-Type: application/json'
          CREDS='{"email":"ci@example.com","password":"supersecret"}'
          curl -fsS -X POST http://localhost:8081/api/auth/register -H "$JSON" -d "$CREDS"
          TOKEN=$(curl -fsS -X POST http://localhost:8081/api/auth/login -H "$JSON" -d "$CREDS" | jq -r .accessToken)
          curl -fsS http://localhost:8081/api/users/me -H "Authorization: Bearer $TOKEN"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8081/api/monitors -H "Authorization: Bearer $TOKEN" -H "$JSON" -d '{"name":"ci","target":"https://example.com","type":"HTTP","intervalSeconds":30,"timeoutSeconds":10}')" = "201"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8081/api/monitors -H "Authorization: Bearer $TOKEN" -H "$JSON" -d '{"name":"ssrf","target":"http://169.254.169.254/","type":"HTTP","intervalSeconds":30,"timeoutSeconds":10}')" = "400"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8081/api/monitors)" = "401"

      - name: Web app and API proxy
        run: |
          set -euo pipefail
          JSON='Content-Type: application/json'
          CREDS='{"email":"proxy@example.com","password":"supersecret"}'
          curl -fsS http://localhost:8080/ -o /tmp/index.html
          grep -q 'id="root"' /tmp/index.html
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/monitors/1)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/users/me)" = "401"
          curl -fsS -X POST http://localhost:8080/api/auth/register -H "$JSON" -d "$CREDS"
          TOKEN=$(curl -fsS -X POST http://localhost:8080/api/auth/login -H "$JSON" -d "$CREDS" | jq -r .accessToken)
          curl -fsS http://localhost:8080/api/users/me -H "Authorization: Bearer $TOKEN"
          curl -sI http://localhost:8080/ -o /tmp/headers.txt
          grep -qi 'content-security-policy' /tmp/headers.txt

      - name: Observability stack
        run: |
          set -euo pipefail
          docker compose ps
          # The API exposes the metrics, including the custom check metrics
          curl -fsS http://localhost:8081/actuator/prometheus | grep -q 'pulsewatch_checks_total'
          # nginx forwards only /api/, so the metrics must not be reachable through the web app
          if curl -s http://localhost:8080/actuator/prometheus | grep -q 'pulsewatch_checks_total'; then
            echo "Metrics are exposed through nginx"; exit 1
          fi
          # Prometheus scrapes the API successfully
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:9090/api/v1/targets \
              | jq -e '.data.activeTargets[] | select(.labels.job=="pulsewatch-api") | select(.health=="up")' > /dev/null; then
              echo "Prometheus target is up"; break
            fi
            if [ "$i" = "30" ]; then echo "Prometheus target never became up"; exit 1; fi
            sleep 2
          done
          # Grafana is healthy, with the provisioned datasource and dashboard
          PW=$(grep '^GRAFANA_ADMIN_PASSWORD=' .env | cut -d= -f2-)
          curl -fsS http://localhost:3001/api/health | jq -e '.database=="ok"'
          curl -fsS -u "admin:$PW" http://localhost:3001/api/datasources/uid/prometheus | jq -e '.type=="prometheus"'
          curl -fsS -u "admin:$PW" http://localhost:3001/api/dashboards/uid/pulsewatch-overview | jq -e '.dashboard.title=="PulseWatch overview"'

      - name: Show logs on failure
        if: failure()
        run: docker compose logs

      - name: Stop the stack
        if: always()
        run: docker compose down -v

  frontend:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
